services:
  - type: web
    name: p6-intelligence
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: pip install .
    startCommand: uvicorn p6intel.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: P6INTEL_MAX_UPLOAD_MB
        value: "25"
